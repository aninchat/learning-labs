timeout: 10s

inputs:
  kafka_in:
    type: kafka
    address: kafka1:9092,kafka2:9092,kafka3:9092
    topics: gnmi.telemetry
    group-id: gnmic-vm-consumer
    format: event

outputs:
  vm_remote_write:
    type: prometheus_write
    url: http://vmsingle:8428/api/v1/write
    timeout: 10s
    event-processors:
      - bgp-state-to-int
      - oper-status-to-numeric
      - admin-status-to-numeric
  debug_file:
    type: file
    filename: /tmp/gnmic-logs.json

input-outputs:
  kafka_in:
    - vm_remote_write

processors:
  oper-status-to-numeric:
    event-strings:
      paths:
        - "^interfaces/interface.*/state$"
      value-names:
        - "oper-status$"
      transforms:
        - replace:
            apply-on: "value"
            old: "UP"
            new: "1"
        - replace:
            apply-on: "value"
            old: "DOWN"
            new: "0"
  admin-status-to-numeric:
    event-strings:
      paths:
        - "^interfaces/interface.*/state$"
      value-names:
        - "admin-status$"
      transforms:
        - replace:
            apply-on: "value"
            old: "UP"
            new: "1"
        - replace:
            apply-on: "value"
            old: "DOWN"
            new: "0"
  bgp-state-to-int:
    event-strings:
      paths:
        - "^network-instances/.*/protocols/.*/bgp/neighbors/.*/state$"
      value-names:
        - "session-state$"
      transforms:
        - replace:
            apply-on: "value"
            old: "ESTABLISHED"
            new: "5"
        - replace:
            apply-on: "value"
            old: "OPENCONFIRM"
            new: "4"
        - replace:
            apply-on: "value"
            old: "OPENSENT"
            new: "3"
        - replace:
            apply-on: "value"
            old: "ACTIVE"
            new: "2"
        - replace:
            apply-on: "value"
            old: "CONNECT"
            new: "1"
        - replace:
            apply-on: "value"
            old: "IDLE"
            new: "0"